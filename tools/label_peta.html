<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alat pelabelan peta (khusus development)</title>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; font: 14px system-ui, sans-serif; background: #0b1020; color: #e8ecf5; }
        header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: .5rem .75rem; align-items: center; padding: .75rem 1rem; background: #121a30; border-bottom: 1px solid #26314f; }
        input, button { font: inherit; padding: .4rem .7rem; border: 1px solid #33416b; border-radius: .4rem; background: #1a2442; color: inherit; }
        input[type=checkbox], input[type=range] { padding: 0; }
        button { cursor: pointer; }
        button:hover { background: #24315c; }
        small { flex-basis: 100%; color: #9aa7c7; }
        #stage { height: calc(100vh - 96px); overflow: auto; }
        #stage svg { display: block; width: 100%; cursor: crosshair; touch-action: none; }
        #lasso { fill: rgba(255, 255, 255, .12); stroke: #fff; stroke-width: 1.5; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; pointer-events: none; }
    </style>
</head>
<body>
<header>
    <input id="region" list="regionList" size="34" placeholder="Nama wilayah, mis. Kalimantan Timur" autofocus>
    <datalist id="regionList"></datalist>
    <label><input id="eraser" type="checkbox"> Penghapus</label>
    <button id="undo" type="button">Urungkan</button>
    <label>Zoom <input id="zoom" type="range" min="1" max="6" step="0.5" value="1"></label>
    <output id="progress"></output>
    <button id="download" type="button">Unduh SVG berlabel</button>
    <small>Ketik/pilih nama wilayah, lalu seret mouse mengelilingi path-path wilayah itu. Garis putih tebal = batas provinsi. Hasil tersimpan otomatis di browser.</small>
</header>
<div id="stage"></div>

<script type="module">
    import { ISO_PROVINCE_NAMES } from "../provinsi.js";

    const SVG_URL = "../assets/destinasi_page/Indonesian_provinsi_map.svg";   // ← sesuaikan nama file aslimu
    const STORAGE_KEY = `peta-labels:${SVG_URL}`;
    const SVG_NS = "http://www.w3.org/2000/svg";

    const $ = (id) => document.getElementById(id);
    const hueOf = (name) => [...name].reduce((hash, char) => (hash * 31 + char.charCodeAt(0)) % 360, 7);
    const isRegion = (shape) => shape.hasAttribute("fill") && shape.getAttribute("fill") !== "none";

    /** Ray casting: apakah titik berada di dalam poligon? */
    function contains(polygon, { x, y }) {
        let inside = false;
        for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
            const a = polygon[i];
            const b = polygon[j];
            if ((a.y > y) !== (b.y > y) && x < ((b.x - a.x) * (y - a.y)) / (b.y - a.y) + a.x) inside = !inside;
        }
        return inside;
    }

    async function loadMap() {
        const response = await fetch(SVG_URL);
        if (!response.ok) throw new Error(`Gagal memuat ${SVG_URL}`);

        $("stage").innerHTML = await response.text();
        const svg = $("stage").querySelector("svg");
        svg.removeAttribute("width");
        svg.removeAttribute("height");
        // Garis batas tanpa atribut fill akan terisi hitam secara default.
        svg.querySelectorAll("path:not([fill])").forEach((line) => line.setAttribute("fill", "none"));
        return svg;
    }

    $("regionList").replaceChildren(...Object.values(ISO_PROVINCE_NAMES).map((name) => new Option(name)));

    const svg = await loadMap();
    const shapes = [...svg.querySelectorAll("path")].filter(isRegion);
    const centers = shapes.map((shape) => {
        const box = shape.getBBox();
        return { x: box.x + box.width / 2, y: box.y + box.height / 2 };
    });

    const labels = new Map(JSON.parse(localStorage.getItem(STORAGE_KEY) ?? "[]"));
    const history = [];

    function render(index) {
        const name = labels.get(index);
        shapes[index].style.fill = name ? `hsl(${hueOf(name)} 65% 55%)` : "";
    }

    function refresh() {
        $("progress").value = `${labels.size} / ${shapes.length} path berlabel`;
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...labels]));
    }

    /** @param {[number, string | undefined][]} entries pasangan [indeks, nama]; nama kosong = hapus label */
    function setLabels(entries) {
        for (const [index, name] of entries) {
            if (name) labels.set(index, name);
            else labels.delete(index);
            render(index);
        }
        refresh();
    }

    function assign(indices, name) {
        history.push(indices.map((index) => [index, labels.get(index)]));
        setLabels(indices.map((index) => [index, name]));
    }

    function undo() {
        const previous = history.pop();
        if (previous) setLabels(previous);
    }

    /* ---------- Lasso ---------- */

    const lasso = document.createElementNS(SVG_NS, "polygon");
    lasso.id = "lasso";
    svg.append(lasso);

    let points = null;
    const drawLasso = () => lasso.setAttribute("points", points?.map((p) => `${p.x},${p.y}`).join(" ") ?? "");
    const toSvgPoint = (event) => new DOMPoint(event.clientX, event.clientY).matrixTransform(svg.getScreenCTM().inverse());

    function finishLasso() {
        if (!points) return;
        const polygon = points;
        points = null;
        drawLasso();
        if (polygon.length < 3) return;

        const name = $("eraser").checked ? "" : $("region").value.trim();
        if (!$("eraser").checked && !name) {
            alert("Isi nama wilayah dulu, atau aktifkan mode Penghapus.");
            return;
        }

        const indices = centers.flatMap((center, index) => (contains(polygon, center) ? [index] : []));
        if (indices.length) assign(indices, name);
    }

    svg.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        svg.setPointerCapture(event.pointerId);
        points = [toSvgPoint(event)];
        drawLasso();
    });
    svg.addEventListener("pointermove", (event) => {
        if (!points) return;
        points.push(toSvgPoint(event));
        drawLasso();
    });
    svg.addEventListener("pointerup", finishLasso);
    svg.addEventListener("pointercancel", () => {
        points = null;
        drawLasso();
    });

    /* ---------- Kontrol & ekspor ---------- */

    $("undo").addEventListener("click", undo);
    $("zoom").addEventListener("input", (event) => {
        svg.style.width = `${event.target.value * 100}%`;
    });

    $("download").addEventListener("click", () => {
        const unlabeled = shapes.length - labels.size;
        if (unlabeled && !confirm(`${unlabeled} path belum berlabel dan tidak akan interaktif. Tetap unduh?`)) return;

        const copy = svg.cloneNode(true);
        copy.querySelector("#lasso")?.remove();
        copy.removeAttribute("style");

        [...copy.querySelectorAll("path")].filter(isRegion).forEach((shape, index) => {
            shape.removeAttribute("style");
            const name = labels.get(index);
            if (name) shape.dataset.region = name;
        });

        const blob = new Blob([new XMLSerializer().serializeToString(copy)], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);
        Object.assign(document.createElement("a"), { href: url, download: "peta-provinsi-berlabel.svg" }).click();
        setTimeout(() => URL.revokeObjectURL(url), 0);
    });

    shapes.forEach((_, index) => render(index));
    refresh();
</script>
</body>
</html>
